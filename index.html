<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Terminal</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0d1117;color:#e6edf3;font-family:Arial,sans-serif;padding:14px;max-width:640px;margin:0 auto}
  h1{font-size:18px;margin:0 0 10px}
  .row{display:flex;gap:8px;margin-bottom:10px}
  input{flex:1;min-width:0;padding:10px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:16px;text-transform:uppercase}
  button{padding:10px 16px;border:0;border-radius:8px;background:#238636;color:#fff;font-size:16px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{padding:6px 10px;border-radius:14px;background:#21262d;color:#e6edf3;font-size:13px;border:1px solid #30363d}
  .card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px;margin-bottom:10px}
  .head{display:flex;justify-content:space-between;align-items:center}
  .lbl{font-size:12px;color:#8b949e}
  .val{font-size:18px;font-weight:bold;margin-top:3px}
  .note{font-size:13px;margin-top:4px;color:#c9d1d9}
  .tag{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:bold}
  .tg{background:#12331c;color:#3fb950}
  .tr{background:#3d1417;color:#f85149}
  .tn{background:#3a2f0b;color:#d29922}
  .g{color:#3fb950}.r{color:#f85149}.y{color:#d29922}
  .bar{height:12px;border-radius:6px;background:#f85149;overflow:hidden;margin-top:8px}
  .bar div{height:100%;background:#3fb950}
  .verdict{text-align:center;padding:16px}
  .verdict .big{font-size:24px;font-weight:bold;margin:6px 0}
  #err{color:#f85149;font-size:13px;margin-bottom:8px}
  #time{font-size:12px;color:#8b949e;text-align:center;margin:8px 0}
  .foot{font-size:12px;color:#8b949e;text-align:center;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<h1>Market Terminal</h1>
<div class="row">
  <input id="sym" value="BTCUSDT">
  <button onclick="load()">Load</button>
</div>
<div class="chips">
  <span class="chip" onclick="pick('BTCUSDT')">BTC</span>
  <span class="chip" onclick="pick('ETHUSDT')">ETH</span>
  <span class="chip" onclick="pick('SOLUSDT')">SOL</span>
  <span class="chip" onclick="pick('XRPUSDT')">XRP</span>
  <span class="chip" onclick="pick('DOGEUSDT')">DOGE</span>
</div>
<div id="err"></div>
<div id="out"><div class="card">Loading...</div></div>
<div id="time"></div>
<div class="foot">
  Ye sirf analysis ka madadgar hai. Kisi profit ya accuracy ki guarantee nahi.<br>
  Data: Binance Futures public API. Probability aur Expected Value backtest ke baad Step 3 mein aayenge.
</div>

<script>
var F = "https://fapi.binance.com";

function pick(s){ document.getElementById("sym").value = s; load(); }
function j(path){
  return fetch(F + path).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}
function num(x){ return Number(x); }
function fmt(n){
  n = Number(n);
  if(Math.abs(n) >= 1e9) return (n/1e9).toFixed(2) + "B";
  if(Math.abs(n) >= 1e6) return (n/1e6).toFixed(2) + "M";
  if(Math.abs(n) >= 1e3) return (n/1e3).toFixed(2) + "K";
  return n.toFixed(2);
}
function px(n){
  n = Number(n);
  if(n >= 100) return n.toFixed(2);
  if(n >= 1) return n.toFixed(4);
  return n.toPrecision(4);
}
function mean(a){ var s = 0; for(var i = 0; i < a.length; i++) s += a[i]; return a.length ? s / a.length : 0; }

/* ---------- layers ---------- */
function layerBook(depth){
  if(!depth) return null;
  var bid = 0, ask = 0, bw = {q:0,p:0}, aw = {q:0,p:0};
  depth.bids.forEach(function(x){ var p = num(x[0]), q = num(x[1]); bid += p*q; if(q > bw.q){ bw.q = q; bw.p = p; } });
  depth.asks.forEach(function(x){ var p = num(x[0]), q = num(x[1]); ask += p*q; if(q > aw.q){ aw.q = q; aw.p = p; } });
  var share = bid / (bid + ask) * 100;
  var s = share > 58 ? 1 : (share < 42 ? -1 : 0);
  return {title:"Order Book & Imbalance", score:s,
    value:"Buy " + share.toFixed(1) + "% / Sell " + (100-share).toFixed(1) + "%",
    note:(s > 0 ? "Buyers ka dabao zyada. " : s < 0 ? "Sellers ka dabao zyada. " : "Balanced. ") +
      "Bari buy wall: " + px(bw.p) + " | Bari sell wall: " + px(aw.p),
    bar:share};
}
function layerFlow(k1){
  if(!k1) return null;
  var c = k1.slice(0, -1).slice(-30), buy = 0, tot = 0;
  c.forEach(function(k){ buy += num(k[9]); tot += num(k[5]); });
  var r = buy / tot * 100;
  var s = r > 53 ? 1 : (r < 47 ? -1 : 0);
  return {title:"Flow (Aggressive Buy/Sell, 30 min)", score:s,
    value:"Market buyers " + r.toFixed(1) + "%",
    note:(s > 0 ? "Market orders se khareedari zyada" : s < 0 ? "Market orders se bechna zyada" : "Flow neutral"),
    bar:r};
}
function layerFutures(prem, oi, oih, k5, ls){
  if(!prem) return null;
  var fr = num(prem.lastFundingRate) * 100;
  var out = {title:"Futures: Funding & Open Interest", score:0};
  var parts = ["Funding " + fr.toFixed(4) + "%"];
  var note = [];
  if(fr > 0.05) note.push("Funding bohat high: longs crowded, ulta move ka risk");
  else if(fr < -0.05) note.push("Funding negative: shorts crowded");
  if(oih && oih.length > 2 && k5 && k5.length > 13){
    var o0 = num(oih[0].sumOpenInterest), o1 = num(oih[oih.length-1].sumOpenInterest);
    var oc = (o1 - o0) / o0 * 100;
    var p0 = num(k5[k5.length-13][4]), p1 = num(k5[k5.length-1][4]);
    var pc = (p1 - p0) / p0 * 100;
    parts.push("OI 1h " + oc.toFixed(2) + "%");
    parts.push("Price 1h " + pc.toFixed(2) + "%");
    if(Math.abs(oc) >= 0.3){
      if(oc > 0 && pc > 0){ out.score = 1; note.push("OI aur price dono upar: naye longs aa rahe hain"); }
      else if(oc > 0 && pc < 0){ out.score = -1; note.push("OI upar price neeche: naye shorts aa rahe hain"); }
      else if(oc < 0 && pc > 0){ note.push("OI neeche price upar: short covering (kamzor move)"); }
      else { note.push("OI neeche price neeche: longs nikal rahe hain"); }
    } else note.push("OI mein khaas change nahi");
  } else if(oi){
    parts.push("OI " + fmt(oi.openInterest));
  }
  if(ls && ls.length){
    parts.push("Long/Short acc. " + num(ls[0].longShortRatio).toFixed(2));
  }
  out.value = parts.join(" | ");
  out.note = note.join(". ");
  return out;
}
function vwapLayer(k1){
  if(!k1) return null;
  var pv = 0, v = 0;
  k1.forEach(function(k){ var tp = (num(k[2]) + num(k[3]) + num(k[4])) / 3; pv += tp * num(k[5]); v += num(k[5]); });
  var vw = pv / v, last = num(k1[k1.length-1][4]);
  var d = (last - vw) / vw * 100;
  var s = d > 0.1 ? 1 : (d < -0.1 ? -1 : 0);
  return {title:"VWAP (4 ghante)", score:s,
    value:"VWAP " + px(vw) + " | Price " + d.toFixed(2) + "% " + (d >= 0 ? "upar" : "neeche"),
    note:(s > 0 ? "Price VWAP se upar: buyers control mein" : s < 0 ? "Price VWAP se neeche: sellers control mein" : "Price VWAP ke qareeb")};
}
function volLayer(k5){
  if(!k5 || k5.length < 25) return null;
  var c = k5.slice(0, -1);
  var last = c[c.length-1];
  var prev = c.slice(-21, -1).map(function(k){ return num(k[5]); });
  var ratio = num(last[5]) / mean(prev);
  var green = num(last[4]) >= num(last[1]);
  var s = 0, n = "Volume normal";
  if(ratio >= 1.8){ s = green ? 1 : -1; n = "Volume spike (" + ratio.toFixed(1) + "x), candle " + (green ? "green" : "red"); }
  return {title:"Volume Spike (5m)", score:s, value:"Last 5m candle volume: " + ratio.toFixed(2) + "x average", note:n};
}
function rsiLayer(k5){
  if(!k5 || k5.length < 30) return null;
  var cl = k5.slice(0, -1).map(function(k){ return num(k[4]); });
  var g = 0, l = 0, i;
  for(i = 1; i <= 14; i++){ var d = cl[i] - cl[i-1]; if(d >= 0) g += d; else l -= d; }
  g /= 14; l /= 14;
  for(i = 15; i < cl.length; i++){
    var dd = cl[i] - cl[i-1];
    g = (g * 13 + (dd > 0 ? dd : 0)) / 14;
    l = (l * 13 + (dd < 0 ? -dd : 0)) / 14;
  }
  var rsi = l === 0 ? 100 : 100 - 100 / (1 + g / l);
  var s = rsi > 55 ? 1 : (rsi < 45 ? -1 : 0);
  var n = s > 0 ? "Momentum upar" : s < 0 ? "Momentum neeche" : "Momentum neutral";
  if(rsi > 75) n += " (overbought, pullback ka risk)";
  if(rsi < 25) n += " (oversold, bounce ka imkaan)";
  return {title:"RSI (5m)", score:s, value:"RSI " + rsi.toFixed(1), note:n};
}
function structLayer(k15){
  if(!k15 || k15.length < 30) return null;
  var c = k15.slice(0, -1), H = c.map(function(k){ return num(k[2]); }), L = c.map(function(k){ return num(k[3]); });
  var sh = [], sl = [], i, j2, isH, isL, w = 3;
  for(i = w; i < c.length - w; i++){
    isH = true; isL = true;
    for(j2 = 1; j2 <= w; j2++){
      if(!(H[i] > H[i-j2] && H[i] > H[i+j2])) isH = false;
      if(!(L[i] < L[i-j2] && L[i] < L[i+j2])) isL = false;
    }
    if(isH) sh.push(H[i]);
    if(isL) sl.push(L[i]);
  }
  if(sh.length < 2 || sl.length < 2) return {title:"Market Structure (15m)", score:0, value:"Range / saaf swing nahi", note:"Swing points kam hain"};
  var hh = sh[sh.length-1] > sh[sh.length-2], hl = sl[sl.length-1] > sl[sl.length-2];
  var s = 0, v = "Range";
  if(hh && hl){ s = 1; v = "Uptrend (Higher High + Higher Low)"; }
  else if(!hh && !hl){ s = -1; v = "Downtrend (Lower High + Lower Low)"; }
  else v = "Mixed / Range";
  return {title:"Market Structure (15m)", score:s, value:v,
    note:"Last swing high " + px(sh[sh.length-1]) + " | Last swing low " + px(sl[sl.length-1])};
}
function sweepLayer(k5){
  if(!k5 || k5.length < 30) return null;
  var c = k5.slice(0, -1), recent = c.slice(-3), base = c.slice(-23, -3);
  var hi = Math.max.apply(null, base.map(function(k){ return num(k[2]); }));
  var lo = Math.min.apply(null, base.map(function(k){ return num(k[3]); }));
  var up = false, dn = false;
  recent.forEach(function(k){
    if(num(k[2]) > hi && num(k[4]) < hi) up = true;
    if(num(k[3]) < lo && num(k[4]) > lo) dn = true;
  });
  var s = 0, n = "Koi sweep nahi", v = "Range " + px(lo) + " - " + px(hi);
  if(up && !dn){ s = -1; n = "Upar ke stops sweep hue aur price wapas andar: bearish"; }
  else if(dn && !up){ s = 1; n = "Neeche ke stops sweep hue aur price wapas andar: bullish"; }
  else if(up && dn){ n = "Dono taraf sweep: choppy"; }
  return {title:"Liquidity & Sweeps (5m)", score:s, value:v, note:n + ". (Asli liquidation data baad mein)"};
}
function regime(k15){
  if(!k15 || k15.length < 60) return null;
  var c = k15.slice(0, -1), tr = [], i;
  for(i = 1; i < c.length; i++){
    var h = num(c[i][2]), l = num(c[i][3]), pc = num(c[i-1][4]);
    tr.push(Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)));
  }
  var atrNow = mean(tr.slice(-14)), atrBase = mean(tr.slice(-80));
  var ratio = atrNow / atrBase;
  var cl = c.slice(-21).map(function(k){ return num(k[4]); }), net = Math.abs(cl[cl.length-1] - cl[0]), path = 0;
  for(i = 1; i < cl.length; i++) path += Math.abs(cl[i] - cl[i-1]);
  var er = path ? net / path : 0;
  var type = "Range", cls = "tn";
  if(ratio > 1.6){ type = "Volatile"; cls = "tr"; }
  else if(er > 0.35){ type = "Trending"; cls = "tg"; }
  var atrPct = atrNow / cl[cl.length-1] * 100;
  return {type:type, cls:cls, er:er, ratio:ratio, atrPct:atrPct};
}

/* ---------- render ---------- */
function tag(s){
  if(s > 0) return '<span class="tag tg">BULLISH +1</span>';
  if(s < 0) return '<span class="tag tr">BEARISH -1</span>';
  return '<span class="tag tn">NEUTRAL 0</span>';
}
function card(L){
  var h = '<div class="card"><div class="head"><div class="lbl">' + L.title + '</div>' + tag(L.score) + '</div>';
  h += '<div class="val">' + L.value + '</div>';
  if(L.bar !== undefined) h += '<div class="bar"><div style="width:' + L.bar + '%"></div></div>';
  h += '<div class="note">' + L.note + '</div></div>';
  return h;
}

function load(){
  var s = document.getElementById("sym").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
  document.getElementById("sym").value = s;
  document.getElementById("err").textContent = "";
  var q = "?symbol=" + s;
  var jobs = [
    j("/fapi/v1/depth" + q + "&limit=100"),
    j("/fapi/v1/premiumIndex" + q),
    j("/fapi/v1/openInterest" + q),
    j("/fapi/v1/ticker/24hr" + q),
    j("/fapi/v1/klines" + q + "&interval=1m&limit=240"),
    j("/fapi/v1/klines" + q + "&interval=5m&limit=100"),
    j("/fapi/v1/klines" + q + "&interval=15m&limit=100"),
    j("/futures/data/openInterestHist" + q + "&period=5m&limit=13"),
    j("/futures/data/globalLongShortAccountRatio" + q + "&period=5m&limit=1")
  ];
  Promise.allSettled(jobs).then(function(r){
    var d = r.map(function(x){ return x.status === "fulfilled" ? x.value : null; });
    if(!d[0] && !d[1] && !d[3]){
      var why = r[0].reason ? r[0].reason.message : "";
      throw new Error("Data nahi aaya (" + why + "). Coin ka naam ya internet check karo");
    }
    var t = d[3];
    var layers = [
      layerBook(d[0]), layerFlow(d[4]), layerFutures(d[1], d[2], d[7], d[5], d[8]),
      vwapLayer(d[4]), volLayer(d[5]), rsiLayer(d[5]), structLayer(d[6]), sweepLayer(d[5])
    ].filter(function(x){ return x; });
    var reg = regime(d[6]);

    var sum = 0;
    layers.forEach(function(x){ sum += x.score; });
    var n = layers.length;
    var vt, vc, vn;
    if(reg && reg.type === "Volatile"){
      vt = "NO TRADE"; vc = "y"; vn = "Market bohat volatile hai, risk zyada. Intezar behtar.";
    } else if(n >= 6 && sum >= 4){
      vt = "LONG lean"; vc = "g"; vn = "Zyada layers buyers ki taraf hain.";
    } else if(n >= 6 && sum <= -4){
      vt = "SHORT lean"; vc = "r"; vn = "Zyada layers sellers ki taraf hain.";
    } else {
      vt = "NO TRADE"; vc = "y"; vn = "Layers mein agreement kam hai. Saaf position nahi.";
    }

    var h = "";
    if(t){
      var chg = num(t.priceChangePercent);
      h += '<div class="card"><div class="lbl">' + s + ' | 24h Volume ' + fmt(t.quoteVolume) + ' USDT</div>' +
           '<div class="val ' + (chg >= 0 ? "g" : "r") + '">' + px(t.lastPrice) + '  (' + chg.toFixed(2) + '%)</div></div>';
    }
    h += '<div class="card verdict"><div class="lbl">Overall (' + n + ' layers)</div>' +
         '<div class="big ' + vc + '">' + vt + '</div>' +
         '<div class="note">Score: ' + sum + ' / ' + n + '</div><div class="note">' + vn + '</div></div>';
    if(reg){
      h += '<div class="card"><div class="head"><div class="lbl">Market Regime (15m)</div><span class="tag ' + reg.cls + '">' + reg.type.toUpperCase() + '</span></div>' +
           '<div class="val">Trend strength ' + (reg.er * 100).toFixed(0) + '% | ATR ' + reg.atrPct.toFixed(2) + '%</div>' +
           '<div class="note">Volatility abhi normal ka ' + reg.ratio.toFixed(2) + ' guna hai</div></div>';
    }
    layers.forEach(function(x){ h += card(x); });
    document.getElementById("out").innerHTML = h;
    document.getElementById("time").textContent = "Updated: " + new Date().toLocaleTimeString();
  }).catch(function(e){
    document.getElementById("err").textContent = "Error: " + e.message;
  });
}
load();
setInterval(load, 20000);
</script>
</body>
</html>
